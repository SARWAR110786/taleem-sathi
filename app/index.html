<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taleem Sathi</title>
<meta name="description" content="People's School Thatta ka student helper: kitaben, scholarships aur Study Buddy.">
<meta name="theme-color" content="#0A6FB4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2E59; --blue:#0A6FB4; --blue-2:#085C96; --sky:#13A3E0; --gold:#C49A3C;
  --paper:#F5F8FC; --line:#E1E8F2; --ink:#0F2440; --muted:#5A6B85; --white:#fff;
  --ok:#1C8A57; --warn:#B87512; --bad:#B4372F;
  --radius-bubble:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--paper);position:relative}
@media (min-width:760px){.app{box-shadow:0 0 0 1px var(--line)}}

/* header */
.top{background:#fff;color:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 14px 0;position:relative;z-index:2;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.top img{width:50px;height:36px;object-fit:contain;flex:none}
.who{flex:1;min-width:0}
.who h1{font-family:'Lexend',sans-serif;font-weight:600;font-size:19px;margin:0;line-height:1.15;color:var(--navy);letter-spacing:-.2px}
.who p{margin:0;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#2DBE7E;display:inline-block;flex:none}
.offline .dot{background:#E9A23B}
.icon-btn{background:#fff;border:1.5px solid var(--line);color:var(--blue);border-radius:12px;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.icon-btn:hover{border-color:var(--blue);background:#F0F6FC}
.icon-btn svg{width:18px;height:18px}
@media (max-width:440px){.icon-btn .lbl{display:none}.icon-btn{padding:0 10px}}
.band{height:3px;background:linear-gradient(90deg,var(--gold),#E2C27A 50%,var(--gold));margin:0 -14px}

/* chat */
.log{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth;overscroll-behavior:contain}
.day{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 14px}
.msg{display:flex;margin:6px 0;animation:rise .22s ease-out both}
.msg.me{justify-content:flex-end}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.typing i{animation:none!important}}
.bubble{max-width:86%;padding:10px 14px;border-radius:var(--radius-bubble);word-wrap:break-word;overflow-wrap:anywhere}
.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.me .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bubble strong{font-weight:700}
.bubble a{color:var(--blue);font-weight:600}
.me .bubble a{color:#CFE3F7}

/* list rows */
.list{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:92%;overflow:hidden}
.list-title{padding:12px 14px 8px;font-weight:600}
.list button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--ink);font-size:16px}
.list button:hover:not(:disabled){background:#F1F5FC}
.list button::after{content:"";width:8px;height:8px;border-right:2px solid var(--blue);border-top:2px solid var(--blue);transform:rotate(45deg);flex:none}
.list button:disabled{color:var(--muted);cursor:default}
.list button:disabled::after{border-color:var(--line)}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px;max-width:94%;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:3px solid var(--sky)}
.card.sch{border-top-color:var(--gold)}
.card h3{margin:0 0 2px;font-size:16.5px;line-height:1.35;font-weight:700}
.card .src{color:var(--muted);font-size:13.5px}
.card p{margin:6px 0 0;font-size:15px;color:#33405F}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin:6px 0 0;background:#E6F2FB;color:var(--blue)}
.badge.OPEN{background:#E3F4EC;color:var(--ok)} .badge.UPCOMING{background:#FCF1DF;color:var(--warn)}
.badge.CLOSED{background:#F8E5E4;color:var(--bad)} .badge.UNKNOWN{background:#EEF1F6;color:var(--muted)}
.fields{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14.5px}
.fields dt{color:var(--muted)} .fields dd{margin:0}
.link-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--blue);color:#fff;text-decoration:none;padding:7px 14px;border-radius:10px;font-weight:600;font-size:14.5px}
.link-btn:hover{background:var(--blue-2)}
.link-btn svg{width:15px;height:15px}

/* quick replies */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{background:#fff;border:1.5px solid var(--blue);color:var(--blue);padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px}
.chip:hover:not(:disabled){background:#E6F2FB}
.chip:disabled{border-color:var(--line);color:var(--muted);cursor:default}
.chips.main .chip{background:var(--blue);color:#fff}.chips.main .chip:hover:not(:disabled){background:var(--blue-2)}.chips.main .chip:disabled{background:#fff;color:var(--muted)}

/* typing */
.typing{display:flex;align-items:center;gap:10px}
.typing span{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sky);display:block;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.typing em{font-style:normal;color:var(--muted);font-size:14.5px}

.retry{margin-top:8px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:6px 14px;font-weight:600}

/* composer */
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:22px;padding:10px 16px;font:inherit;font-size:16px;max-height:120px;line-height:1.4;background:var(--paper);color:var(--ink)}
.composer textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{background:#C9CFDC}
.send svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.install-card{position:absolute;left:12px;right:12px;bottom:84px;z-index:5;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:14px 40px 14px 14px;box-shadow:0 12px 32px rgba(11,46,89,.18);animation:rise .25s ease-out both}
.install-card[hidden],.install-card [hidden]{display:none}
.install-card img{border-radius:12px;flex:none}
.install-card b{color:var(--navy)}
.install-card p{margin:2px 0 8px;font-size:14.5px;color:var(--muted)}
.install-go{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.install-help{margin:0;padding-left:18px;font-size:14.5px;line-height:1.55}
.install-x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-row">
      <img src="../assets/school-emblem.png" alt="People's School Thatta logo">
      <div class="who">
        <h1>Taleem Sathi</h1>
        <p><span class="dot"></span><span id="status">People's School Thatta</span></p>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Main menu kholein">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="lbl">Menu</span>
      </button>
      <button class="icon-btn" id="newBtn" aria-label="Naya chat shuru karein" title="Naya chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="band" aria-hidden="true"></div>
  </header>

  <main class="log" id="log" aria-live="polite" aria-label="Chat"></main>

  <form class="composer" id="form" autocomplete="off">
    <label for="input" class="sr">Apna paigham likhein</label>
    <textarea id="input" rows="1" placeholder="Yahan likhein…" maxlength="1000"></textarea>
    <button class="send" id="send" type="submit" aria-label="Bhejein">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.9L3.4 3.6c-.7-.3-1.4.3-1.3 1L3 10.5l10 1.5-10 1.5-.9 5.9c-.1.7.6 1.3 1.3 1z"/></svg>
    </button>
  </form>
  <div class="toast" id="toast" role="status"></div>
  <div class="install-card" id="installCard" hidden role="dialog" aria-labelledby="installTitle">
    <button class="install-x" id="installClose" type="button" aria-label="Band karein">&times;</button>
    <img src="icons/icon-192.png" alt="" width="52" height="52">
    <div>
      <b id="installTitle">Taleem Sathi ko phone par lagayein</b>
      <p>Home screen par icon aa jayega, bilkul app ki tarah khulega.</p>
      <button class="install-go" id="installGo" type="button" hidden>Install karein</button>
      <ol class="install-help" id="installHelp" hidden>
        <li>Chrome mein upar dayein taraf <b>&#8942;</b> (teen nuqte) dabayein</li>
        <li><b>"Install app"</b> ya <b>"Add to Home screen"</b> chunein</li>
        <li><b>Install</b> dabayein. Ho gaya!</li>
      </ol>
    </div>
  </div>
</div>

<script>
(() => {
  const WEBHOOK = 'https://hahoiu.app.n8n.cloud/webhook/taleem-sathi';
  const TIMEOUT_MS = 75000;
  const HISTORY_KEY = 'ts_history_v1';

  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send'), form = $('form');

  // ---------- storage (works even if storage is blocked) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
  let userId = store.get('ts_uid');
  if (!userId) { userId = 'app-' + uuid(); store.set('ts_uid', userId); }

  let state = store.get('ts_state') || 'MAIN_MENU';
  let busy = false;
  let history = [];
  try { history = JSON.parse(store.get(HISTORY_KEY) || '[]'); } catch (e) { history = []; }
  const save = () => store.set(HISTORY_KEY, JSON.stringify(history.slice(-60)));

  // ---------- text formatting ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (s) => esc(s)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">Link</a>')
    .replace(/\n/g, '<br>');
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : null;
  const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>';

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const scroll = () => requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });

  // ---------- rendering ----------
  function row(side) { const r = el('div', 'msg ' + side); log.appendChild(r); return r; }

  function renderUser(text) {
    row('me').appendChild(el('div', 'bubble', esc(text)));
  }

  function renderBot(resp, live) {
    (resp.messages || []).forEach((m) => {
      const r = row('bot');
      if (m.type === 'list') {
        const box = el('div', 'list');
        box.appendChild(el('div', 'list-title', fmt(m.title)));
        (m.rows || []).forEach((rw) => {
          const b = el('button', 'act', esc(rw.title));
          b.type = 'button';
          b.addEventListener('click', () => choose(rw.id, rw.title));
          box.appendChild(b);
        });
        r.appendChild(box);
      } else if (m.type === 'cards') {
        const wrap = el('div', 'cards');
        (m.items || []).forEach((c) => {
          const card = el('article', 'card' + (m.kind === 'scholarship' ? ' sch' : ''));
          let h = `<h3>${esc(c.title)}</h3>`;
          if (c.subtitle) h += `<div class="src">${esc(c.subtitle)}</div>`;
          if (c.badge) h += `<span class="badge ${esc(c.badge)}">${esc(c.badge === 'UNKNOWN' ? 'Status maloom nahi' : c.badge)}</span>`;
          if (Array.isArray(c.fields) && c.fields.length) {
            h += '<dl class="fields">' + c.fields.map((f) => `<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join('') + '</dl>';
          }
          if (c.description) h += `<p>${esc(c.description)}</p>`;
          const u = safeUrl(c.url);
          if (u) h += `<a class="link-btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(c.link_label || 'Link')} ${linkIcon}</a>`;
          card.innerHTML = h;
          wrap.appendChild(card);
        });
        r.appendChild(wrap);
      } else {
        r.appendChild(el('div', 'bubble', fmt(m.text)));
      }
    });
    if (resp.buttons && resp.buttons.length) {
      const chips = el('div', 'chips' + (resp.buttons.length === 3 && resp.buttons[0].id === 'BOOKS' ? ' main' : ''));
      resp.buttons.forEach((b) => {
        const c = el('button', 'chip act', esc(b.title));
        c.type = 'button';
        c.addEventListener('click', () => choose(b.id, b.title));
        chips.appendChild(c);
      });
      log.appendChild(chips);
    }
    if (!live) disableOld();
  }

  // only the newest reply's buttons and list rows stay active
  function disableOld() {
    log.querySelectorAll('.act').forEach((b) => { b.disabled = true; });
  }

  let typingRow = null;
  function showTyping(label) {
    typingRow = row('bot');
    typingRow.appendChild(el('div', 'bubble typing', `<span aria-hidden="true"><i></i><i></i><i></i></span>${label ? `<em>${esc(label)}</em>` : '<em class="sr">Likh raha hai</em>'}`));
    scroll();
  }
  function hideTyping() { if (typingRow) { typingRow.remove(); typingRow = null; } }

  function loadingLabel(payload) {
    const id = payload.button_id || '';
    if (/^SL_/.test(id)) return 'Taaza scholarships dhoond raha hoon… is mein 30 second tak lag sakte hain';
    if (/^BS_/.test(id) && state === 'BOOK_SUBJECT') return 'Kitab dhoond raha hoon, thora intezar karein…';
    if (payload.type === 'text' && (state === 'BOOK_CUSTOM' || state === 'BOOK_SUBJECT')) return 'Kitab dhoond raha hoon, thora intezar karein…';
    if (payload.type === 'text' && state === 'STUDY_BUDDY') return 'Soch raha hoon…';
    return '';
  }

  // ---------- talking to the agent ----------
  async function send(payload, shownText, opts = {}) {
    if (busy) return;
    busy = true; setBusy(true);
    if (shownText && !opts.silent) {
      renderUser(shownText);
      history.push({ role: 'me', text: shownText }); save();
    }
    disableOld();
    showTyping(loadingLabel(payload));
    const body = { user_id: userId, message_id: 'm-' + uuid(), channel: 'app', ...payload };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      hideTyping();
      if (data.duplicate) return;
      if (data.state) { state = data.state; store.set('ts_state', state); }
      renderBot(data, true);
      history.push({ role: 'bot', resp: { messages: data.messages, buttons: data.buttons } }); save();
    } catch (err) {
      hideTyping();
      const offline = !navigator.onLine;
      const r = row('bot');
      const b = el('div', 'bubble', offline
        ? 'Internet connection nahi hai. Connection check karke dobara bhejein.'
        : (err.name === 'AbortError' ? 'Jawab aane mein bohot der ho gayi. Dobara koshish karein.' : 'Server se jawab nahi mila. Thori der baad dobara koshish karein.'));
      const retry = el('button', 'retry', 'Dobara bhejein');
      retry.type = 'button';
      retry.addEventListener('click', () => { r.remove(); busy = false; send(payload, shownText, { silent: true }); });
      b.appendChild(el('br')); b.appendChild(retry);
      r.appendChild(b);
    } finally {
      clearTimeout(timer);
      busy = false; setBusy(false); scroll();
    }
  }

  function choose(id, title) { send({ type: 'button', button_id: id }, title.replace(/^[^\p{L}\p{N}]+/u, '').trim() || title); }

  function setBusy(on) { sendBtn.disabled = on || !input.value.trim(); input.setAttribute('aria-busy', on ? 'true' : 'false'); }

  // ---------- composer ----------
  const autosize = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; sendBtn.disabled = busy || !input.value.trim(); };
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = ''; autosize();
    send({ type: 'text', text }, text);
  });

  $('menuBtn').addEventListener('click', () => send({ type: 'button', button_id: 'MENU' }, 'Menu'));
  $('newBtn').addEventListener('click', () => {
    if (busy) return;
    history = []; save(); log.innerHTML = '';
    log.appendChild(el('div', 'day', 'Naya chat'));
    send({ type: 'text', text: 'start' }, null, { silent: true });
  });

  // ---------- connection status ----------
  const top = $('top'), status = $('status');
  const net = () => { const on = navigator.onLine; top.classList.toggle('offline', !on); status.textContent = on ? "People's School Thatta" : 'Offline: internet check karein'; };
  addEventListener('online', net); addEventListener('offline', net); net();

  // ---------- start ----------
  log.appendChild(el('div', 'day', 'Aaj'));
  if (history.length) {
    history.forEach((h) => (h.role === 'me' ? renderUser(h.text) : renderBot(h.resp, true)));
    // keep the last reply's buttons usable, older ones off
    const acts = log.querySelectorAll('.act');
    const lastChips = log.lastElementChild;
    acts.forEach((b) => { b.disabled = true; });
    if (lastChips && lastChips.classList.contains('chips')) lastChips.querySelectorAll('.act').forEach((b) => { b.disabled = false; });
    // state is unknown after reload: Menu always works
    scroll();
  } else {
    send({ type: 'text', text: 'start' }, null, { silent: true });
  }
  autosize();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // ---------- install card (opened from "Download Android App") ----------
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const wantInstall = /[?&]install=1/.test(location.search);
  let deferred = null;
  const card = $('installCard'), go = $('installGo'), help = $('installHelp');
  const showCard = () => { if (!standalone) card.hidden = false; };
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e;
    go.hidden = false; help.hidden = true;
    showCard();
  });
  go.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    if (outcome === 'accepted') { card.hidden = true; }
  });
  $('installClose').addEventListener('click', () => { card.hidden = true; });
  addEventListener('appinstalled', () => { card.hidden = true; });
  if (wantInstall) {
    showCard();
    // no install prompt from the browser: show the manual steps
    setTimeout(() => { if (!deferred) { go.hidden = true; help.hidden = false; } }, 1500);
  }
})();
</script>
