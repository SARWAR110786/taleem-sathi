name: Make Urdu voiceover
on:
  push:
    branches: [voice]
    paths: [voice/script.json]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate speech for each line
        run: |
          mkdir -p voice/audio
          for id in $(jq -r '.[].id' voice/script.json); do
            jq -c --arg id "$id" '.[] | select(.id==$id) | {text: .text, voice: "onyx"}' voice/script.json > /tmp/body.json
            for try in 1 2 3; do
              code=$(curl -s -o "voice/audio/$id.mp3" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data @/tmp/body.json https://hahoiu.app.n8n.cloud/webhook/taleem-sathi-tts)
              size=$(stat -c %s "voice/audio/$id.mp3")
              echo "$id -> $code $size bytes"
              if [ "$code" = "200" ] && [ "$size" -gt 5000 ]; then break; fi
              sleep 5
            done
          done
      - name: Save audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voice/audio
          git commit -m "Add Urdu voiceover audio" || echo "nothing to commit"
          git push
